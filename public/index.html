<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Shortener</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>URL Shortener</h1>

    <section>
      <h2>Shorten a link</h2>
      <form id="create-form">
        <label>Long URL
          <input id="url" type="url" placeholder="https://example.com/a/long/page" required>
        </label>
        <label>Custom code (optional)
          <input id="code" type="text" placeholder="my-code" pattern="[A-Za-z0-9_-]{3,16}">
        </label>
        <button type="submit">Shorten</button>
      </form>
      <p id="create-result" role="status"></p>
    </section>

    <section>
      <h2>Check clicks</h2>
      <form id="stats-form">
        <label>Short code
          <input id="stats-code" type="text" placeholder="hello" required>
        </label>
        <button type="submit">Look up</button>
      </form>
      <p id="stats-result" role="status"></p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
